function sanitizeHTML(str){
    if(!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {

    });

let bannerInterval = null;
function rotateBannerSafe(cb, time = 3000){

    signOut, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAWLzshfnKTye2vLJs3GXC-ijJ7s4iKdm0",
    authDomain: "lbcokies.firebaseapp.com",
    projectId: "lbcokies",
    storageBucket: "lbcokies.firebasestorage.app",
    messagingSenderId: "107095661481",
    appId: "1:107095661481:web:07fa7989e503d8cc2f82b8",
    measurementId: "G-R3MCZBTNZD"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const auth = getAuth(app);
window.db   = db;

// Persistência offline
enableIndexedDbPersistence(db).catch(err => {

// ===================================================
// COLEÇÕES ESTRUTURADAS DO FIRESTORE
// ===================================================
// usuarios/       → perfis de usuário (UID como ID)
// pedidos/        → pedidos ativos (pedidoId como ID)
// historico_caixa/→ fechamentos de caixa
// configuracoes/  → config global e produtos
// notificacoes/   → notificações admin
// ===================================================

// Salva nas coleções corretas
window.salvarBD = async (chave, dados) => {
    localStorage.setItem(chave, JSON.stringify(dados));
    // Coleções globais (produtos, config, etc.) ficam em "configuracoes"
    const colecoesGlobais = ['lb_historico_fechamentos', 'lb_financas', 'lb_config', 'lb_produtos', 'lb_extras'];
    if(colecoesGlobais.includes(chave)){
        try {
            await setDoc(doc(db, "configuracoes", chave), { valor: dados, updatedAt: Date.now() }, { merge: true });
        } catch(e) { console.error("Erro ao salvar na nuvem:", e); }
    }
};

// Sincronização global (carrega configurações da nuvem)
let isFirstSnapshot = true;
window.sincronizarFirebase = async () => {
    const chavesGlobais = ['lb_historico_fechamentos', 'lb_financas', 'lb_config', 'lb_produtos', 'lb_extras'];
    for(let chave of chavesGlobais){
        try {
            const snap = await getDoc(doc(db, "configuracoes", chave));
            if(snap.exists()){
                localStorage.setItem(chave, JSON.stringify(snap.data().valor));
            }
        } catch(e){ console.error("Erro sincronizando global", chave, e); }
    }
    carregarDados();
    iniciarRadarPedidos();
};

// Radar em tempo real de pedidos (separado, chamado após login)
let unsubscribePedidos = null;
function iniciarRadarPedidos(){
    if(!appState.user) return;
    if(unsubscribePedidos) { unsubscribePedidos(); unsubscribePedidos = null; }

    const uid  = appState.user.uid;
    const tipo = appState.user.tipo;

    let qPedidos;
    if(tipo === 'admin'){
        qPedidos = query(collection(db, "pedidos"));
    } else if(uid){
        qPedidos = query(collection(db, "pedidos"), where("uid", "==", uid));
    } else {
        // fallback para email (usuários antigos sem UID)
        qPedidos = query(collection(db, "pedidos"), where("email", "==", appState.user.email));
    }

    unsubscribePedidos = onSnapshot(qPedidos, (snapshot) => {
        let lista = [];
        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            lista.push(data);
            // Notificação admin para novos pedidos
            if(tipo === 'admin' && !isFirstSnapshot && !appState.pedidos.find(p => p.id === data.id)){
                appState.adminNotifs.unshift({
                    id: data.id,
                    cliente: data.cliente || 'Cliente',
                    msg: `Fez um pedido de R$ ${(data.total || 0).toFixed(2)}`,
                    hora: new Date().toLocaleTimeString().slice(0,5)
                });
                localStorage.setItem('lb_admin_notifs', JSON.stringify(appState.adminNotifs));
                window.dispararNotificacao("Novo Pedido! 🔔", `${data.cliente} acabou de pedir!`);
                window.atualizarBadgeNotifs();
                window.renderAdminNotifs();
            }
        });

        lista.sort((a,b) => (b.criadoEm || 0) - (a.criadoEm || 0));
        appState.pedidos = lista;
        localStorage.setItem('lb_pedidos', JSON.stringify(lista));

        const contentDiv = document.getElementById('lista-pedidos-cliente');
        if(contentDiv) renderPedidosCliente();

        const agendaDiv = document.getElementById('lista-agenda-render');
        if(agendaDiv){
            const currentTab = document.getElementById('btn-tab-agenda');
            if(currentTab && currentTab.classList.contains('bg-[var(--lb-pink-dark)]')){
                renderAdmTabs('agenda');
            }
        }
        isFirstSnapshot = false;
    });
}

// MODO ESCURO
// ===================================================
window.toggleDarkMode = () => {
    const body = document.body;
    body.classList.toggle('dark-mode');
    const isDark = body.classList.contains('dark-mode');

// ===================================================
// NOTIFICAÇÕES
// ===================================================
function pedirPermissaoNotificacao(){
    if("Notification" in window && Notification.permission !== "granted"){
        Notification.requestPermission();
    }
}

window.dispararNotificacao = (titulo, mensagem) => {
    if("Notification" in window && Notification.permission === "granted"){
        if(navigator.serviceWorker){
            navigator.serviceWorker.ready.then(registration => {
                registration.showNotification(titulo, {
                    body: mensagem,
                    icon: 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png',
                    vibrate: [200, 100, 200]
                });
            });
        } else {
            new Notification(titulo, { body: mensagem });
        }
    }
};

// ===================================================
// PWA
// ===================================================
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const btnHeader = document.getElementById('btn-instalar-header');
    if(btnHeader) btnHeader.classList.remove('hidden');
});

window.instalarPWA = async () => {
    if(deferredPrompt){
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if(outcome === 'accepted'){
            const btnHeader = document.getElementById('btn-instalar-header');
            if(btnHeader) btnHeader.classList.add('hidden');
        }
        deferredPrompt = null;
    }
};

// ===================================================
// ALERTAS GLOBAIS
// ===================================================
window.showCustomAlert = (title, message, type = 'info') => {
    document.getElementById('generic-alert-title').innerText = title;
    document.getElementById('generic-alert-message').innerText = message;
    const wrapper = document.getElementById('generic-alert-icon-wrapper');
    const icon    = document.getElementById('generic-alert-icon');
    if(type === 'error'){
        wrapper.className = "w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto -mt-12 mb-4 border-4 border-white shadow-sm";
        icon.setAttribute('data-lucide','x-circle'); icon.className = "w-8 h-8 text-red-500";
    } else if(type === 'success'){
        wrapper.className = "w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto -mt-12 mb-4 border-4 border-white shadow-sm";
        icon.setAttribute('data-lucide','check-circle-2'); icon.className = "w-8 h-8 text-green-500";
    } else {
        wrapper.className = "w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto -mt-12 mb-4 border-4 border-white shadow-sm";
        icon.setAttribute('data-lucide','info'); icon.className = "w-8 h-8 text-blue-500";
    }
    document.getElementById('generic-alert').classList.remove('hidden');
    lucide.createIcons();
};

window.fecharGenericAlert = () => {
    document.getElementById('generic-alert').classList.add('hidden');
};

window.showCustomConfirm = (title, message, onConfirm) => {
    document.getElementById('confirm-title').innerText = title;
    document.getElementById('confirm-message').innerText = message;
    const btnYes = document.getElementById('btn-confirm-yes');
    btnYes.onclick = () => { fecharCustomConfirm(); if(onConfirm) onConfirm(); };
    document.getElementById('custom-confirm').classList.remove('hidden');
};

window.fecharCustomConfirm = () => {
    document.getElementById('custom-confirm').classList.add('hidden');
};

// ===================================================
// TIMELINE
// ===================================================
window.renderTimeline = (status) => {
    const isProd   = status === 'Produzindo' || status === 'Pronto/Saiu para Entrega';
    const isPronto = status === 'Pronto/Saiu para Entrega';
    return `
        <div class="flex items-center justify-between mt-5 mb-2 relative px-4">
            <div class="absolute left-4 right-4 top-1/2 h-1.5 bg-gray-100 -z-10 -translate-y-1/2 rounded-full"></div>
            <div class="absolute left-4 top-1/2 h-1.5 bg-[var(--lb-pink-dark)] -z-10 -translate-y-1/2 rounded-full timeline-line" style="width: ${isPronto ? 'calc(100% - 2rem)' : isProd ? '50%' : '0%'}"></div>

window.renderBottomNav = () => {
    const nav     = document.getElementById('bottom-nav');
    const isAdmin = appState.user && appState.user.tipo === 'admin';
    nav.innerHTML = `
        <button onclick="changeTab('home')" id="tab-home" class="nav-item flex flex-col items-center gap-1 text-gray-400 p-2"><i data-lucide="home" class="w-6 h-6"></i></button>
        <button onclick="changeTab('menu')" id="tab-menu" class="nav-item flex flex-col items-center gap-1 text-gray-400 p-2"><i data-lucide="cookie" class="w-6 h-6"></i></button>
        ${isAdmin
            ? `<button onclick="changeTab('adm')" id="tab-adm" class="nav-item flex flex-col items-center gap-1 text-[var(--lb-pink-dark)] p-2"><i data-lucide="layout-dashboard" class="w-6 h-6"></i></button>`
            : `<button onclick="changeTab('carrinho')" id="tab-carrinho" class="nav-item flex flex-col items-center gap-1 text-gray-400 relative p-2"><i data-lucide="shopping-bag" class="w-6 h-6"></i></button>`
        }
        <button onclick="abrirPerfil()" id="tab-perfil" class="nav-item flex flex-col items-center gap-1 text-gray-400 p-2"><i data-lucide="user" class="w-6 h-6"></i></button>
    `;
    lucide.createIcons();
};

window.changeTab = (tab) => {
    carregarDados();
    document.getElementById('app-content').innerHTML = typeof Screens[tab] === 'function' ? Screens[tab]() : Screens[tab];
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-tab'));
    const activeNav = document.getElementById(`tab-${tab}`);
    if(activeNav) activeNav.classList.add('active-tab');
    lucide.createIcons();
    window.scrollTo(0,0);
    if(tab === 'carrinho') atualizarTelaCarrinho();
    if(tab === 'adm'){ renderAdmTabs('painel'); window.renderAdminNotifs(); }
    if(tab === 'perfilCliente'){
        renderPedidosCliente();
        setTimeout(() => {
            const toggle = document.getElementById('darkModeSwitch');

        }, 10);

// ─── LOGIN REAL (Firebase Auth) ───
window.fazerLogin = async () => {
    const emailInput = document.getElementById('login-email');
    const senhaInput = document.getElementById('login-senha');
    const btn        = document.getElementById('btn-entrar');
    const e = emailInput.value.trim();
    const s = senhaInput.value;

    if(!e || !s) return showCustomAlert("Atenção","Preencha email e senha para acessar.","error");

    // Botão loading
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Entrando...`;

    // ─ Verifica se é admin (hash local, sem criar usuário no Auth) ─
    const adminHash = btoa(e + ":" + s);
    if(adminHash === "YWRtaW5AbGIuY29tOmxiMjAyNA=="){
        appState.user = { tipo:'admin', nome:'Admin LB', email: e, uid: 'admin' };
        localStorage.setItem('lb_user', JSON.stringify(appState.user));
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Entrar na Loja`;
        lucide.createIcons();
        window.renderBottomNav();
        await window.sincronizarFirebase();
        changeTab('adm');
        return;
    }

    // ─ Login real no Firebase Auth ─
    try {
        const cred = await signInWithEmailAndPassword(auth, e, s);
        const fireUser = cred.user;
        // Carrega perfil do Firestore
        let perfil = { tipo:'cliente', nome: fireUser.displayName || e.split('@')[0], email: e, uid: fireUser.uid, bairro:'', numero:'', telefone:'' };
        try {
            const snap = await getDoc(doc(db, "usuarios", fireUser.uid));
            if(snap.exists()) perfil = { ...perfil, ...snap.data() };
        } catch(_){}
        appState.user = perfil;
        localStorage.setItem('lb_user', JSON.stringify(appState.user));
        window.renderBottomNav();
        await window.sincronizarFirebase();
        changeTab('home');
    } catch(err){
        let msg = "E-mail ou senha incorretos.";
        if(err.code === 'auth/user-not-found')  msg = "Conta não encontrada. Crie uma conta primeiro.";
        if(err.code === 'auth/wrong-password')  msg = "Senha incorreta. Tente novamente.";
        if(err.code === 'auth/invalid-email')   msg = "E-mail inválido.";
        if(err.code === 'auth/too-many-requests') msg = "Muitas tentativas. Aguarde um momento.";
        showCustomAlert("Erro no Login", msg, "error");
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Entrar na Loja`;
        lucide.createIcons();
    }
};

// ─── CADASTRO REAL (Firebase Auth) ───
window.fazerCadastro = async () => {
    const nome  = document.getElementById('cad-nome').value.trim();
    const email = document.getElementById('cad-email').value.trim();
    const senha = document.getElementById('cad-senha').value;
    const btn   = document.getElementById('btn-cadastrar');

    if(!nome || !email || !senha) return showCustomAlert("Atenção","Preencha todos os campos.","error");
    if(senha.length < 6)          return showCustomAlert("Senha Curta","A senha precisa ter no mínimo 6 caracteres.","error");

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Criando conta...`;

    try {
        const cred = await createUserWithEmailAndPassword(auth, email, senha);
        const fireUser = cred.user;

        // Atualiza displayName no Auth
        await updateProfile(fireUser, { displayName: nome });

        // Cria documento do usuário no Firestore (coleção "usuarios")
        const perfilDoc = {
            uid: fireUser.uid,
            nome: nome,
            email: email,
            telefone: '',
            bairro: '',
            numero: '',
            tipo: 'cliente',
            criadoEm: Date.now()
        };
        await setDoc(doc(db, "usuarios", fireUser.uid), perfilDoc);

        appState.user = perfilDoc;
        localStorage.setItem('lb_user', JSON.stringify(appState.user));
        window.renderBottomNav();
        await window.sincronizarFirebase();
        showCustomAlert("Bem-vinda! 🍪", `Olá ${nome}, sua conta foi criada com sucesso!`, "success");
        changeTab('home');
    } catch(err){
        let msg = "Erro ao criar conta.";
        if(err.code === 'auth/email-already-in-use') msg = "Este e-mail já está cadastrado. Faça login.";
        if(err.code === 'auth/invalid-email')        msg = "E-mail inválido.";
        if(err.code === 'auth/weak-password')        msg = "Senha muito fraca. Use ao menos 6 caracteres.";
        showCustomAlert("Erro no Cadastro", msg, "error");
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i> Criar Minha Conta`;
        lucide.createIcons();
    }
};

// Observa mudanças de estado do Auth (ex.: sessão expirada)
onAuthStateChanged(auth, async (fireUser) => {
    if(!fireUser) return; // Não-logado, sem ação
    // Usuário ainda logado: garante que o appState está sincronizado
    const salvo = JSON.parse(localStorage.getItem('lb_user'));
    if(salvo && salvo.uid === fireUser.uid) return; // Já carregado
    if(salvo && salvo.tipo === 'admin') return;      // Admin local, ignora
    // Recarrega perfil
    try {
        const snap = await getDoc(doc(db, "usuarios", fireUser.uid));
        if(snap.exists()){
            appState.user = { ...snap.data(), uid: fireUser.uid };
            localStorage.setItem('lb_user', JSON.stringify(appState.user));
            window.renderBottomNav();
        }
    } catch(_){}
});

window.finalizarPedido = async () => {
    // ── Lock anti-duplicação ──
    if(appState.enviandoPedido) return;

    const bairro   = document.getElementById('cli-bairro').value;
    const numero   = document.getElementById('cli-numero').value;
    const hora     = document.getElementById('cli-hora').value;
    const pagamento = document.getElementById('cli-pagamento').value;
    const marcadoPago = document.getElementById('check-pago')?.checked || false;

    if(!bairro || !numero || !hora || !pagamento)
        return showCustomAlert("Incompleto","Preencha Bairro, Número, Horário e Pagamento!","error");

    // Ativa lock + loading visual
    appState.enviandoPedido = true;
    const btn = document.getElementById('btn-finalizar-pedido');
    if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Enviando pedido...`; }

    const displayAddress = `${bairro}, Nº ${numero}, Regente Feijó`;
    const total = appState.cart.reduce((s,i) => s+i.preco, 0);

    // ID único com crypto.randomUUID() (anti-duplicação real)
    const pedidoId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID().split('-')[0].toUpperCase()
        : Date.now().toString(36).toUpperCase();

    const ped = {
        id: pedidoId,
        uid: appState.user.uid || null,
        email: appState.user.email,
        cliente: appState.user.nome || appState.user.email.split('@')[0],
        telefone: appState.user.telefone || '',
        itensArray: appState.cart,
        itens: appState.cart.map(i => i.nome).join(', '),
        total: total,
        endereco: displayAddress,
        hora: hora,
        pagamento: pagamento,                              // 'pix' ou 'entrega'
        statusPagamento: pagamento === 'pix' && marcadoPago ? 'pago' : 'pendente',
        pago: marcadoPago,
        status: 'Fila',
        data: new Date().toLocaleDateString(),
        criadoEm: Date.now()
    };

    // ── Verificação anti-duplicação: pedido idêntico nos últimos 60s ──
    const agora = Date.now();
    const pedidoRecente = appState.pedidos.find(p =>
        p.uid === ped.uid &&
        p.itens === ped.itens &&
        (agora - (p.criadoEm || 0)) < 60000
    );
    if(pedidoRecente){
        appState.enviandoPedido = false;
        if(btn){ btn.disabled = false; btn.innerHTML = `<i data-lucide="send" class="w-5 h-5"></i> Confirmar e Enviar Pedido`; lucide.createIcons(); }
        return showCustomAlert("Atenção","Você já enviou um pedido idêntico há menos de 1 minuto. Aguarde a confirmação!","error");
    }

    // ── Salva no Firestore (coleção "pedidos") ──
    try {
        await setDoc(doc(db, "pedidos", ped.id), ped);
    } catch(e){ console.error("Erro firestore pedido", e); }

    // ── Envia via WhatsApp ──
    const labelPgto = pagamento === 'pix' ? 'PIX' : 'Pagar na Entrega';
    const statusPgto = marcadoPago ? ' (JÁ PAGO)' : ' (A PAGAR)';
    let textZap = `*NOVO PEDIDO #${ped.id} | LB COOKIES*%0A%0A*Cliente:* ${ped.cliente}%0A*WhatsApp:* ${ped.telefone || 'Não cadastrado'}%0A*Endereço:* ${displayAddress}%0A*Horário:* ${hora}%0A*Pag:* ${labelPgto}${statusPgto}%0A%0A*Pedido:*%0A${appState.cart.map(i=>`- ${i.nome}`).join('%0A')}%0A%0A*Total:* R$ ${total.toFixed(2).replace('.',',')}`;
    window.open(`https://wa.me/5518996717062?text=${textZap}`, '_blank');

    // ── Limpa carrinho ──
    appState.cart = [];
    localStorage.setItem('lb_cart', JSON.stringify([]));
    document.getElementById('cart-count').innerText = 0;

    // ── Libera lock ──
    appState.enviandoPedido = false;

    changeTab('perfilCliente');
    showCustomAlert("Pedido Enviado! 🍪","Acompanhe o status em Minhas Compras.","success");
};

                    <input type="checkbox" id="conf-banner-ativo" ${appState.config.bannerAtivo ? 'checked' : ''} class="w-4 h-4 accent-[var(--lb-pink-dark)]">
                    <label class="text-xs font-bold text-gray-600">Ativar Banner Promocional / Aviso</label>
                </div>
                <input type="text" id="conf-banner-texto" placeholder="Ex: 🔥 Promoção do dia!" value="${appState.config.bannerTexto}" class="w-full p-3 border rounded-xl bg-gray-50 text-sm mb-4 outline-none focus:ring-1 ring-[var(--lb-pink-dark)]">
                <button onclick="salvarConfigAdm()" class="w-full btn-pink py-3 text-sm shadow-md">Salvar Configurações</button>
            </div>

            <div class="bg-red-50 p-5 rounded-[24px] border border-red-200 shadow-sm relative overflow-hidden mt-6">
                <i data-lucide="shield-alert" class="absolute -right-4 -top-4 w-24 h-24 text-red-100 opacity-50"></i>
                <h3 class="font-bold mb-2 text-sm text-red-600 flex items-center gap-2"><i data-lucide="archive"></i> Fechar Expediente / Caixa</h3>
                <p class="text-[10px] text-gray-600 mb-4 font-medium leading-relaxed">Isso vai somar os lucros de hoje no Gráfico do Painel e vai LIMPAR a aba de Pedidos (Agenda) para você iniciar o próximo dia de vendas limpo.</p>
                <button onclick="fecharCaixaAdm()" class="w-full bg-red-500 text-white font-bold py-4 rounded-xl text-sm shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 relative z-10 hover:bg-red-600"><i data-lucide="save"></i> Encerrar Dia Oficialmente</button>
            </div>
        `;
    }
    lucide.createIcons();
};

// ===================================================
// FILTROS
// ===================================================
window.filtrarAgenda = () => {
    const termo = document.getElementById('busca-agenda').value.toLowerCase();
    const itens  = document.querySelectorAll('.item-agenda');
    let visiveis = 0;
    itens.forEach(item => {
        const texto = item.getAttribute('data-nome') + " " + item.getAttribute('data-id');
        if(texto.includes(termo)){ item.style.display='block'; visiveis++; }
        else item.style.display='none';
    });
    const qtdEl = document.getElementById('agenda-qtd');
    if(qtdEl) qtdEl.innerText = `${visiveis} Pedidos`;
};

window.filtrarPessoas = () => {
    const termo = document.getElementById('busca-pessoas').value.toLowerCase();
    document.querySelectorAll('.item-pessoa').forEach(item => {
        const texto = item.getAttribute('data-nome');
        item.style.display = texto.includes(termo) ? 'flex' : 'none';
    });
};

// ===================================================
// GRÁFICO
// ===================================================
window.atualizarGraficoDashboard = () => {
    const ctx = document.getElementById('graficoVendas');
    if(!ctx) return;
    const dadosHistorico = appState.historicoCaixa.slice(-10);
    const labels     = dadosHistorico.map(h => h.data.split(' ')[0]);
    const dataValores = dadosHistorico.map(h => h.total);
    if(window.graficoDashboardObj) window.graficoDashboardObj.destroy();
    window.graficoDashboardObj = new Chart(ctx.getContext('2d'), {
        type: 'bar',
        data: {
            labels: labels.length ? labels : ['Sem Fechamentos'],
            datasets: [{
                label: 'Vendas Faturadas (R$)',
                data: dataValores.length ? dataValores : [0],
                backgroundColor: '#F4A5B0', borderColor: '#E27B8C',
                borderWidth: 1, borderRadius: 6, barPercentage: 0.5
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color:'#f3f4f6', borderDash:[5,5] }, ticks: { font:{size:10}, callback:(v) => 'R$ '+v } },
                x: { grid: { display:false }, ticks: { font:{size:9} } }
            }
        }
    });
};

// ===================================================
// FINANÇAS
// ===================================================
window.adicionarFundoGeral = () => {
    const val = parseFloat(document.getElementById('valor-fundo').value);
    if(isNaN(val) || val <= 0) return showCustomAlert("Inválido","Digite um valor de fundo positivo.","error");
    appState.financas.fundoInicial += val;
    appState.financas.transacoes.push({
        data: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString().slice(0,5),
        desc: 'Aporte de Fundo de Caixa', tipo: 'entrada', valor: val
    });
    window.salvarBD('lb_financas', appState.financas);
    renderAdmTabs('financas');
    showCustomAlert("Concluído","Fundo adicionado ao Caixa Geral.","success");
};

window.registrarTransacao = (tipo) => {
    const desc = document.getElementById('desc-mov').value;
    const val  = parseFloat(document.getElementById('valor-mov').value);
    if(!desc || isNaN(val) || val <= 0) return showCustomAlert("Erro","A descrição e o valor são obrigatórios.","error");
    if(tipo === 'saida') appState.financas.totalDespesas += val;
    else                 appState.financas.totalReceitasAvulsas += val;
    appState.financas.transacoes.push({
        data: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString().slice(0,5),
        desc: desc, tipo: tipo, valor: val
    });
    window.salvarBD('lb_financas', appState.financas);
    renderAdmTabs('financas');
    showCustomAlert("Movimento Salvo","Registrado com sucesso.","success");
};

window.gerarPDFFinancas = () => {
    showCustomAlert("Gerando...","Seu PDF será baixado em instantes.","info");
    const elemento = document.getElementById('area-pdf-financas');
    const opcoes = {
        margin: 10,
        filename: `Relatorio_LB_${new Date().toLocaleDateString().replace(/\//g,'-')}.pdf`,
        image: { type:'jpeg', quality:0.98 },
        html2canvas: { scale:2, useCORS:true },
        jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
    };
    html2pdf().set(opcoes).from(elemento).save();
};

// ===================================================
// LÓGICA ADMIN — PEDIDOS
// ===================================================
window.mudarStatusAdm = async (i, s) => {
    const pedidoModificado = appState.pedidos[i];
    if(!pedidoModificado) return;
    pedidoModificado.status = s;
    try {
        await setDoc(doc(db, "pedidos", pedidoModificado.id), pedidoModificado, { merge:true });
    } catch(e){ console.error("Erro status nuvem", e); }
    const clienteNome = pedidoModificado.cliente;
    window.dispararNotificacao("Atualização do Pedido! 🍪", `Olá ${clienteNome}, seu pedido mudou para: ${s}`);
    showCustomAlert("Atualizado","Status do cliente alterado para: " + s,"success");
};

// ── LIMPAR AGENDA (apenas remove o listener; não deleta do Firestore) ──
window.limparAgenda = () => {
    showCustomConfirm("Limpar Agenda?","Isso vai ocultar todos os pedidos desta visualização. Os pedidos continuam no Firebase.", async () => {
        // Apenas limpa o cache local sem deletar do Firestore
        appState.pedidos = [];
        localStorage.setItem('lb_pedidos', JSON.stringify([]));
        renderAdmTabs('agenda');
        showCustomAlert("Feito","Agenda limpa localmente.","success");
    });
};

// ── LIMPAR PEDIDOS (deleta definitivamente do Firestore) ──
window.limparPedidos = () => {
    showCustomConfirm("⚠️ APAGAR TODOS OS PEDIDOS?","Isso vai DELETAR PERMANENTEMENTE todos os pedidos ativos do Firebase. Essa ação não pode ser desfeita!", async () => {
        try {
            const snapshot = await getDocs(collection(db, "pedidos"));
            const batch = writeBatch(db);
            snapshot.forEach(docSnap => batch.delete(docSnap.ref));
            await batch.commit();
            appState.pedidos = [];
            localStorage.setItem('lb_pedidos', JSON.stringify([]));
            renderAdmTabs('agenda');
            showCustomAlert("Concluído","Todos os pedidos foram apagados do Firebase.","success");
        } catch(e){
            console.error("Erro ao limpar pedidos", e);
            showCustomAlert("Erro","Não foi possível apagar os pedidos.","error");
        }
    });
};

window.prepararEdicaoAdm = (id) => { appState.produtoEditandoId = id; renderAdmTabs('produtos'); window.scrollTo(0,0); };
window.cancelarEdicaoAdm = () => { appState.produtoEditandoId = null; renderAdmTabs('produtos'); };

window.salvarProdutoAdm = () => {
    const idForm = document.getElementById('add-id').value;
    const n = document.getElementById('add-nome').value;
    const d = document.getElementById('add-desc').value;
    const p = parseFloat(document.getElementById('add-preco').value);
    const f = document.getElementById('add-foto').value;
    if(!n || !p) return showCustomAlert("Atenção","O nome e o preço são obrigatórios.","error");
    if(idForm){
        const idx = appState.produtos.findIndex(prod => prod.id === idForm);
        if(idx !== -1){ appState.produtos[idx].nome=n; appState.produtos[idx].desc=d; appState.produtos[idx].preco=p; appState.produtos[idx].foto=f; showCustomAlert("Salvo","Produto editado.","success"); }
        appState.produtoEditandoId = null;
    } else {
        appState.produtos.push({ id:'p'+Date.now(), nome:n, desc:d, preco:p, foto: f||'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=200&q=80', esgotado:false, destaque:false });
        showCustomAlert("Salvo","Novo produto adicionado.","success");
    }
    window.salvarBD('lb_produtos', appState.produtos);
    renderAdmTabs('produtos');
};

window.excluirProdutoAdm = (i) => {
    showCustomConfirm("Excluir Produto","Deseja remover do catálogo?", () => {
        appState.produtos.splice(i,1);
        window.salvarBD('lb_produtos', appState.produtos);
        renderAdmTabs('produtos');
    });
};

window.toggleEstoqueAdm = (i) => {
    appState.produtos[i].esgotado = !appState.produtos[i].esgotado;
    window.salvarBD('lb_produtos', appState.produtos);
    renderAdmTabs('estoque');
};

window.toggleDestaqueAdm = (i) => {
    appState.produtos.forEach(p => p.destaque = false);
    appState.produtos[i].destaque = true;
    window.salvarBD('lb_produtos', appState.produtos);
    renderAdmTabs('produtos');
};

window.salvarExtraAdm = () => {
    const n = document.getElementById('extra-nome').value;
    const p = parseFloat(document.getElementById('extra-preco').value);
    if(!n || isNaN(p)) return showCustomAlert("Atenção","Preencha nome e valor do extra.","error");
    appState.extrasConfig.push({ id:'e'+Date.now(), nome:n, preco:p });
    window.salvarBD('lb_extras', appState.extrasConfig);
    renderAdmTabs('produtos');
};

window.excluirExtraAdm = (idx) => {
    appState.extrasConfig.splice(idx,1);
    window.salvarBD('lb_extras', appState.extrasConfig);
    renderAdmTabs('produtos');
};

window.salvarConfigAdm = () => {
    appState.config.diaEntrega   = document.getElementById('conf-dia').value;
    appState.config.bannerAtivo  = document.getElementById('conf-banner-ativo').checked;
    appState.config.bannerTexto  = document.getElementById('conf-banner-texto').value;
    window.salvarBD('lb_config', appState.config);
    showCustomAlert("Salvo","Configurações atualizadas.","success");
};

window.fecharCaixaAdm = () => {
    showCustomConfirm("Encerrar o Expediente?","Isso mandará todas as vendas de hoje para o histórico e limpará a aba de pedidos.", async () => {
        const totalHoje = appState.pedidos.reduce((s,p) => s+p.total, 0);
        if(appState.pedidos.length > 0){
            appState.historicoCaixa.push({
                data: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString().slice(0,5),
                total: totalHoje,
                qtd: appState.pedidos.length,
                pedidosAnexados: [...appState.pedidos]
            });
            await window.salvarBD('lb_historico_fechamentos', appState.historicoCaixa);
            // Deleta pedidos arquivados da nuvem com batch para eficiência
            try {
                const batch = writeBatch(db);
                for(let p of appState.pedidos) batch.delete(doc(db,"pedidos",p.id));
                await batch.commit();
            } catch(err){ console.error("Erro deletar ao fechar", err); }
        }
        appState.pedidos = [];
        localStorage.setItem('lb_pedidos', JSON.stringify([]));
        window.limparNotifs();
        showCustomAlert("Dia Encerrado","Caixa fechado com sucesso.","success");
        renderAdmTabs('painel');
    });
};

// 1. Bloquear o clique direito do mouse (Menu de Contexto)
document.addEventListener('contextmenu', (event) => {
    event.preventDefault();
});

// 2. Bloquear atalhos do teclado que abrem o Inspecionar
document.addEventListener('keydown', (event) => {
    // Bloqueia o F12
    if (event.key === 'F12') {
        event.preventDefault();
    }
    
    // Bloqueia Ctrl + Shift + I (Inspecionar)
    // Bloqueia Ctrl + Shift + J (Console)
    // Bloqueia Ctrl + U (Ver Código Fonte)
    // Bloqueia Ctrl + S (Salvar Página)
    if (event.ctrlKey && (event.shiftKey && (event.key === 'I' || event.key === 'J') || event.key === 'u' || event.key === 'U' || event.key === 's' || event.key === 'S')) {
        event.preventDefault();
    }
});

        

// ===================================================
// INICIALIZAÇÃO
// ===================================================
window.onload = async () => {
    carregarDados();
    // Restaura modo escuro
    if(localStorage.getItem('lb_dark_mode') === 'true') document.body.classList.add('dark-mode');
    window.renderBottomNav();
    changeTab('home');
    document.getElementById('cart-count').innerText = appState.cart.length;
    pedirPermissaoNotificacao();
    // Sincroniza silenciosamente na nuvem
    await window.sincronizarFirebase();
};
    </script>
